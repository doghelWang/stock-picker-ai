name = "stock-picker-ai"
main = "src/index.js"
compatibility_date = "2024-04-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "72c32b58d9424e899dbd845c62e259c8"

[vars]
# 敏感凭证通过 wrangler secret 加密保存，不在配置文件中明文暴露

[triggers]
# 聚合优化 Cron 调度器（结合 Gemini 1500 次配额的高频自适应调度，0 扣费精准触发）：
# 1. "*/10 1-2,5-6 * * 1-5" -> 盘中交易时段 (09:30-11:30, 13:00-15:00) 每 10 分钟自适应舆情+量化异动巡检
# 2. "0 2,6 * * 1-5"       -> 10:00 早盘起爆 & 14:00 午后反包黄金选股与雪球自动买入
# 3. "5,30 7 * * *"        -> 15:05 每日/周末全息复盘分析 + 15:30 盘后量化大盘更新
# 4. "0 12,14 * * 1-5"     -> 20:00 晚间重大突发舆情排查 + 22:00 欧美夜盘大宗商品联动
crons = [
  "*/10 1-2,5-6 * * 1-5",
  "0 2,6 * * 1-5",
  "5,30 7 * * *",
  "0 12,14 * * 1-5"
]
