name = "stock-picker-ai"
main = "src/index.js"
compatibility_date = "2024-04-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "72c32b58d9424e899dbd845c62e259c8"

[vars]
# 敏感凭证通过 wrangler secret 加密保存，不在配置文件中明文暴露

[triggers]
# 聚合优化 Cron 调度器（占用极小 Quota，0 扣费精准调度）：
# 1. "0 2,6 * * 1-5"  -> 早盘 10:00 与午后 14:00 自动选股与模拟建仓
# 2. "5,30 7 * * *"   -> 15:05 每日/周末全息复盘分析 + 15:30 盘后大盘更新
crons = [
  "0 2,6 * * 1-5",
  "5,30 7 * * *"
]
