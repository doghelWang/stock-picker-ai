name = "stock-picker-ai"
main = "src/index.js"
compatibility_date = "2024-04-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "72c32b58d9424e899dbd845c62e259c8"

[vars]
# 敏感凭证 (TG_BOT_TOKEN / TG_CHAT_ID 等) 通过 wrangler secret 加密保存，不在配置文件中明文暴露

[triggers]
# 【科学优化后的 A 股 3 大黄金交易时段定时器 (0 扣费精准调度)】
# 1. 早盘 10:00 (UTC 02:00): 开盘半小时主力沉淀，确认全天早盘强势龙头与买点
# 2. 午后 14:00 (UTC 06:00): 午后主力攻坚反包，确认尾盘与次日进攻标的
# 3. 盘后 15:30 (UTC 07:30): 全盘收盘定势，生成次日完整投研复盘
crons = [
  "0 2 * * 1-5",
  "0 6 * * 1-5",
  "30 7 * * 1-5"
]
