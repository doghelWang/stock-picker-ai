name = "stock-picker-ai"
main = "src/index.js"
compatibility_date = "2024-04-01"
workers_dev = true

routes = [
  { pattern = "storka.luckycici.cc", custom_domain = true },
  { pattern = "stocka.luckycici.cc", custom_domain = true }
]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "AI_USAGE"
id = "72c32b58d9424e899dbd845c62e259c8"

[vars]
# 敏感凭证通过 wrangler secret 加密保存，不在配置文件中明文暴露

[triggers]
# 聚合优化 Cron 调度器（合并后仅占 4 条 Cron，全账户总数严格控制在 5 条以内）：
# 1. "0 0 * * *"           -> 08:00 每日 AGV/AMR 智能移动机器人硬核科普专栏全自动生成与草稿发布
# 2. "0 2,6 * * 1-5"       -> 10:00 早盘起爆 & 14:00 午后反包黄金选股与雪球自动买入
# 3. "5 7,8 * * *"         -> 15:05 全息复盘 + 16:05 微信公众号每日A股行情深度复盘发布
# 4. "0 12,14 * * 1-5"     -> 20:00 晚间重大突发舆情排查 + 22:00 欧美夜盘大宗商品联动
crons = [
  "0 0 * * *",
  "0 2,6 * * 1-5",
  "5 7,8 * * *",
  "0 12,14 * * 1-5"
]
