[triggers]
# 盘中高频巡检（北京时间工作日 09:30-11:30, 13:00-15:00 每15分钟巡检一次）+ 15:30 盘后总结
# UTC 时间：
# 01:30-03:30 每15分钟 (对应北京时间 09:30-11:30)
# 05:00-07:00 每15分钟 (对应北京时间 13:00-15:00)
# 07:30 (对应北京时间 15:30 盘后总结)
crons = [
  "*/15 1-3 * * 1-5",
  "*/15 5-7 * * 1-5",
  "30 7 * * 1-5"
]
